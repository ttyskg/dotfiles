# Change the prefix key to Ctrl-a
set -g prefix C-a

# Ensure that we can send Ctrl-A to other apps
bind C-a send-prefix

# Dissolve Ctrl-b key bind
unbind C-b

# Enable mouse control
set -g mouse on

# Reduce delay time after escape key
set -sg escape-time 1

# Reload setting file
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Create a new window in the current directory
bind c new-window -c "#{pane_current_path}"

# Split the pane vertically by |
bind | split-window -h -c "#{pane_current_path}"

# Split the pane horizontally by -
bind - split-window -v -c "#{pane_current_path}"

# Move the pane with Vim's key binding
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize the pane with Vim's key binding
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Specify terminal type.
# "xterm-256color" describes the *outer* terminal, not tmux; announcing it
# inside tmux makes programs assume capabilities tmux does not forward.
# tmux-256color is the correct entry and adds italics; fall back when the
# terminfo database does not have it (older or minimal systems).
if-shell 'infocmp tmux-256color > /dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'

# Pass 24-bit colour through to programs inside tmux, which is what Vim's
# 'termguicolors' needs. The pattern is matched against the outer terminal.
set -ga terminal-overrides ",*256col*:Tc,alacritty:Tc"

# COLORTERM is how programs (including .vimrc) decide whether to use 24-bit
# colour, and it is not in update-environment by default, so panes would not
# see it. Take it from the attaching client rather than asserting it, so a
# terminal without true colour is not misreported.
set -ga update-environment " COLORTERM"

# Report terminal focus changes, so Vim's 'autoread' notices file changes.
set -g focus-events on

# Use vim keybindings in copy mode and at the command prompt
setw -g mode-keys vi
set -g status-keys vi

# v to select and y to copy, as in Vim. Without these, copy mode still uses
# Space and Enter. On WSL, copying also puts the text on the Windows
# clipboard, matching <Leader>y in .vimrc.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
if-shell 'command -v clip.exe > /dev/null 2>&1' \
    'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe" ; \
     bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"' \
    'bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel'

# Toggle panes synchronizing
bind S set-window-option synchronize-panes

